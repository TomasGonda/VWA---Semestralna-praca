version: '3'
services:
  web:
    image: ghcr.io/thevajko/vaii-web-server:main
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/framework/public
    volumes:
    - ./../../:/var/www/html/
    - ./../../shared/css:/var/www/html/framework/public/css
    - ./../../shared/js:/var/www/html/framework/public/js
    - ./../../shared/imgs:/var/www/html/framework/public/imgs
    ports:
      - "127.0.0.1:80:80"
    stdin_open: true
    tty: true
  db:
    image: mariadb
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
  adminer:
    links:
      - db
    depends_on:
      - db
    image: adminer
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db